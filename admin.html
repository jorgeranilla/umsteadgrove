<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Umstead Grove Admin Retired</title>
  <style>
    :root {
      color-scheme: light;
      --green: #0f5f66;
      --teal: #24b8c7;
      --gold: #ffd166;
      --cream: #f7fcff;
      --text: #1c1c1c;
      --muted: #5e6b70;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, var(--green), var(--teal));
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100%, 560px);
      padding: 36px;
      border-radius: 20px;
      background: var(--cream);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.22);
    }

    h1 {
      margin-bottom: 12px;
      color: var(--green);
      font-family: Georgia, serif;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
    }

    p {
      margin-bottom: 18px;
      color: var(--muted);
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 26px;
    }

    a {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 48px;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--green);
      color: white;
      font-weight: 700;
      text-decoration: none;
    }

    a.secondary {
      border: 1px solid rgba(15, 95, 102, 0.24);
      background: white;
      color: var(--green);
    }
  </style>
</head>
<body>
  <main>
    <h1>Admin Retired</h1>
    <p>The online lead form and admin dashboard have been retired. Umstead Grove now uses direct phone contact only.</p>
    <p>For showings, questions, or buyer-agent coordination, call or text Jorge directly.</p>
    <div class="actions">
      <a href="tel:8646256743">Call 864-625-6743</a>
      <a class="secondary" href="/">Return to Umstead Grove</a>
    </div>
  </main>
</body>
</html>
